[package]
name = "divshot-editor-tauri"
version = "0.1.0"
description = "DIVSHOT editor shell (Tauri + Web UI)"
authors = ["DIVSHOT"]
edition = "2021"

[lib]
name = "divshot_editor_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "divshot-editor-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
